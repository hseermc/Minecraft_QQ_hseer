name: Gradle构建
on: push


jobs:
  build:
    runs-on: windows-latest
    permissions:
        contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3 # v3.1.0
    - name: build
      shell: cmd
      run: |
        link.cmd && cd server && gradlew build
    - name: update
      uses: actions/upload-artifact@v4
      with:
        name: "Minecraft_QQ"
        path: build/libs/
